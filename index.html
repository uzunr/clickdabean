
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🫘 Bean Clicker</title>

    <link rel="icon" type="image/png" href="bean-icon.png">
    <link rel="stylesheet" href="style.css">

<audio id="bgMusic" loop>
    <source src="Edvard Grieg - Morning Mood (from Peer Gynt, Op. 23).mp3" type="audio/mpeg">
</audio>

<script>
    document.addEventListener("click", function () {
        document.getElementById("bgMusic").play();
    }, { once: true });
</script>

</head>
<body>

<header>
    <h1>🫘 Bean Clicker</h1>
</header>

<div class="container">

    <div class="left-panel">
        <div class="card">
            <h2>Statistics</h2>

            <p>Beans: <span id="count">0</span></p>
            <p>High Score: <span id="highscore">0</span></p>
            <p>Per Click: <span id="clickPower">1</span></p>
            <p>Beans/sec: <span id="beansPerSecond">0</span></p>
        </div>

        <div class="card">
            <h2>Achievements</h2>
            <div id="achievements"></div>
        </div>
    </div>

    <main>

        <div id="bean" class="bean-image"></div>

        <button id="clickButton">
            Click Bean
        </button>

        <p class="hint">
            Click the bean or press the Space bar.
        </p>

        <div id="floatingContainer"></div>

    </main>

    <div class="right-panel">

        <div class="card">

            <h2>Shop</h2>

            <button class="upgrade" id="buyClick">
                Better Bean (+1 Click)
                <span id="clickCost">10</span>
            </button>

            <button class="upgrade" id="buyAuto">
                Auto Clicker
                <span id="autoCost">50</span>
            </button>

            <button class="upgrade" id="buyFarm">
                Bean Farm
                <span id="farmCost">250</span>
            </button>

            <button class="upgrade" id="buyFactory">
                Bean Factory
                <span id="factoryCost">1000</span>
            </button>

        </div>

    </div>

</div>

<div id="toast"></div>

<script src="script.js"></script>



<div id="credits" class="credits">
    Made by Roberto © 2026
    Any feedback or report issues? Contact me at <a href="mailto:uzunroberto@gmail.com">uzunroberto@gmail.com</a>
</div>
</body>
</html>
